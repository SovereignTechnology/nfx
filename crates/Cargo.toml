[workspace]
resolver = "3"
members = ["nfx-proto"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://gitworkshop.dev/npub1s0vtechh66tx7vrwdud8zfyheu9zca7swwfrzd4qu2a4f93mxs6qvn9adx/nfx"

[workspace.dependencies]
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
hex = "0.4.3"
k256 = { version = "0.14.0", default-features = false, features = ["schnorr", "arithmetic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.20"
wasm-bindgen-test = "0.3.78"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
