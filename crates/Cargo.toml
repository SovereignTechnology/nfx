[workspace]
resolver = "3"
members = ["nfx-media", "nfx-node", "nfx-proto", "nfx-wasm", "nfxd"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://gitworkshop.dev/npub1s0vtechh66tx7vrwdud8zfyheu9zca7swwfrzd4qu2a4f93mxs6qvn9adx/nfx"

[workspace.dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
iroh = "1.2.0"
iroh-blobs = "0.103.0"
iroh-gossip = "0.101.0"
iroh-relay = "1.2.0"
iroh-tickets = "1.0.0"
n0-future = "0.3.2"
nostr-memory = "0.45.2"
nostr-sdk = "0.45.4"
nfx-node = { path = "nfx-node", version = "0.1.0" }
nfx-proto = { path = "nfx-proto", version = "0.1.0" }
k256 = { version = "0.14.0", default-features = false, features = ["schnorr", "arithmetic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.20"
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-test = "0.3.78"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
