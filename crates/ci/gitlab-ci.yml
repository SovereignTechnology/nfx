# DORMANT. This repository's CI runs on GitHub Actions (.github/workflows/ci.yml, the same
# two jobs); this file runs nothing, and the fetch below names no real host. The lock still
# pins it (crates/ci/check-locked.sh), so reviving it is a change to the pins.
#
# NFX master-plan CI (ADR 0008). It runs only master-plan checks, never the demo's
# `npm run ci`. The project's CI config path is set to this file; the root
# .gitlab-ci.yml path is left to the demo mirror, so `git merge demo/<tag>` stays
# conflict-free. Runs on the instance's shared runner, so it is kept light:
# tools are downloaded prebuilt and sha256-pinned, never compiled on the runner.

stages: [check]

# A runner VM can be stopped under memory pressure, and that job
# then fails as a runner system failure: requeue it rather than fail the pipeline.
default:
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]

variables:
  GIT_DEPTH: "0"            # the add-only check needs the merge base with demo/main
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  # Keep the shared runner light. With debug info each iroh/nostr test binary is ~450 MB
  # and ~15 of them link in parallel.
  # Without it they are ~94 MB, and a clean test build with 2 jobs measured 3.6 min
  # wall and 0.9 GB peak per process on the dev laptop. Every test still runs.
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_DENY_VERSION: "0.20.2"
  # Matches the release's own .sha256 file and GitHub's asset digest.
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  WASM_PACK_VERSION: "0.13.1"
  # No upstream digest; pinned 2026-09-23 from the release tarball, whose binary is
  # byte-identical to the wasm-pack the local checks ran on.
  WASM_PACK_SHA256: "c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"
  # Official Node build. Debian bookworm's nodejs 18 crashes (V8 abort) running the
  # wasm32 test binary; 22.22.0 is what the local checks use. Hash from nodejs.org SHASUMS256.txt.
  NODE_VERSION: "22.22.0"
  NODE_SHA256: "9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37"

# The lock's verdict (crates/ci/check-locked.sh): its own job, running no unpinned
# repository code, under a clean environment with literal paths, so no pipeline or project
# variable (PATH, CI, PYTHONPATH and the rest included) reaches it. The image is pinned by
# digest and already holds python3 (Debian's, for mercurial), so the job installs nothing
# and has no before_script. lock-job.sh checks that the tree is exactly the pipeline's
# commit and holds nothing untracked but the restored registry cache and index, and the
# money crates are built and tested in a target directory made for the run, so a build
# directory the cache carries in cannot be read (see the `cache` note below).
#
# What the repository cannot enforce, and the project's settings must: pipeline variables
# restricted to no one (they outrank these variables, and a runner acts on some before any
# script runs), and a pushed commit's lock job looked at before it counts (a `[skip ci]`
# push runs no pipeline at all). docs/nfx/reviews/2026-09-24-m2.0-fifth-audit.md.
# On a protected branch the cache is separate, so an unprotected branch cannot write the
# archive the lock job restores; keep protected-branch caches separate in project settings.
lock:
  stage: check
  image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
  # A hang fails in bounded time (each scenario is also timed out on its own thread).
  timeout: 30m
  variables:
    GIT_STRATEGY: clone
    GIT_CHECKOUT: "true"
  script:
    - /usr/bin/env -i PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/root RUSTUP_HOME=/usr/local/rustup CARGO_HOME="$(pwd -P)/.cargo-home" CI=true CI_COMMIT_SHA="$CI_COMMIT_SHA" PYTHON=/usr/bin/python3 /bin/bash -p crates/ci/lock-job.sh
  cache:
    key:
      prefix: lock-$CI_COMMIT_REF_SLUG
      files: [crates/Cargo.lock]
    paths: [.cargo-home/registry/cache, .cargo-home/registry/index]

check:
  stage: check
  image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
  timeout: 90m
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv xz-utils
    - curl -sSfLo /tmp/node.txz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
    - echo "${NODE_SHA256}  /tmp/node.txz" | sha256sum -c -
    - mkdir -p /opt/node && tar -xJf /tmp/node.txz -C /opt/node --strip-components=1 && export PATH="/opt/node/bin:$PATH" && node --version
    - python3 -m venv /opt/venv && /opt/venv/bin/pip install coincurve==21.0.0 pynacl==1.6.2 blake3==1.0.9 jsonschema==4.26.0
    - rustup component add clippy rustfmt && rustup target add wasm32-unknown-unknown
    - curl -sSfLo /tmp/deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - echo "${CARGO_DENY_SHA256}  /tmp/deny.tgz" | sha256sum -c -
    - tar -xzf /tmp/deny.tgz -C /tmp && install -m 0755 "/tmp/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/
    - curl -sSfLo /tmp/wasm-pack.tgz "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - echo "${WASM_PACK_SHA256}  /tmp/wasm-pack.tgz" | sha256sum -c -
    - tar -xzf /tmp/wasm-pack.tgz -C /tmp && install -m 0755 "/tmp/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/
    # Read-only fetch of the public demo repository for the add-only check.
    - git fetch --no-tags https://example.invalid/sovtech/nutflix.git +main:refs/remotes/demo/main
  script:
    # CI=true and an empty LOCKED_DIRS_UNLOCKED are set here, in the pinned file, so no
    # pipeline or project variable can switch the lock off (crates/ci/check-locked.sh).
    - CI=true LOCKED_DIRS_UNLOCKED= PYTHON=/opt/venv/bin/python crates/ci/check.sh
  # This job caches only downloaded archives and the index, keyed by branch and
  # Cargo.lock; it does not cache build output. But the cache is not a security boundary:
  # the runner restores every entry of whatever archive matches the key, and another job
  # (an earlier pipeline on the branch, or, if caches are shared, another unprotected
  # branch) can write that archive with paths of its own, such as a build directory. So the
  # verdict does not trust the checkout: the lock job refuses any untracked or ignored path
  # but the registry cache and index (lock-job.sh), and the money crates are built and
  # tested in a target directory made for the run, refusing any reused compile in CI
  # (locked.py). Keep protected-branch caches separate in project settings.
  cache:
    key:
      prefix: cargo-$CI_COMMIT_REF_SLUG
      files: [crates/Cargo.lock]
    paths: [.cargo-home/registry/cache, .cargo-home/registry/index]
