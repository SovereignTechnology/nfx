[package]
name = "s1-iroh"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike S1: can iroh 1.x + iroh-blobs 0.103 + iroh-gossip 0.101 do what NFX-06 needs?"
license = "AGPL-3.0-or-later"

# Its own workspace: spike dependencies stay out of the main crates/ graph and CI.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.23.1"
hex = "0.4.3"
iroh = "1.2"
iroh-blobs = "0.103"
iroh-gossip = "0.101"
iroh-relay = { version = "1.2", features = ["server"] }
n0-future = "0.3"
nfx-proto = { path = "../../nfx-proto" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
