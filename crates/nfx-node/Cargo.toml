[package]
name = "nfx-node"
version = "0.1.1"
description = "NFX peer: content store, iroh seeding and fetching with sha256 re-anchoring (NFX-05/06), gossip presence, Nostr manifests and beacons (NFX-02/03), the pull-through origin (NFX-05 §6), an embeddable scoped relay (NFX-04)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytes.workspace = true
# The mesh endpoint's session keys and NIP-44 nonces (crate::mesh). Already in the lock and in
# this crate's tree (through iroh), at the version and features the money crates' closure
# pins: no feature is added, so crates/ci/locked-compiled.txt does not move.
getrandom = { version = "0.4.3", default-features = false }
hex.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
iroh-gossip.workspace = true
n0-future.workspace = true
nfx-proto.workspace = true
# The relay CA roots (`NodeConfig::relay_cas`); already in the lock through rustls. Per crate,
# never in [workspace.dependencies], so the workspace manifest's pinned line does not move.
rustls-pki-types = "1.15.1"
nostr-database.workspace = true
nostr-memory.workspace = true
nostr-sdk = { workspace = true, features = ["local-relay"] }
# The mesh endpoint's gateway port mapping (crate::mesh): the one iroh already runs, at the same
# version and with no default feature, as iroh takes it.
portmapper = { version = "0.19.3", default-features = false }
serde_json.workspace = true
str0m.workspace = true
thiserror.workspace = true
tokio.workspace = true
tungstenite.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
base64.workspace = true
iroh-relay = { workspace = true, features = ["server", "test-utils"] }
iroh-tickets.workspace = true
nostr-sdk = { workspace = true, features = ["local-relay"] }
hyper = { workspace = true, features = ["client"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }

[lints]
workspace = true
