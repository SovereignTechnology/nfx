# The desktop app's policy: the main crates/deny.toml plus the exceptions Tauri's tree
# needs, each named. Run: cargo deny --manifest-path desktop/Cargo.toml --config desktop/deny.toml check

# cargo-deny policy for the NFX Rust workspace. Run: cargo deny check (from crates/).

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, notice) fails the check
# unless it is listed here with a reason. cargo-deny's default scope for unsound advisories
# leaves out transitive dependencies: 0.20.2 passed crates/desktop with glib's
# RUSTSEC-2024-0429 in the tree (measured 2026-11-09). Both scopes are "all" so the sentence
# above holds for the whole tree.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # "Unmaintained" notices, not vulnerabilities: compile-time proc macros deep in iroh's
    # tree that cannot be swapped without forking it. Revisit at every iroh bump.
    { id = "RUSTSEC-2024-0436", reason = "paste (proc macro) via iroh > netwatch > netdev > netlink-packet-core; unmaintained notice only" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error (proc macro) via iroh-blobs > bao-tree > genawaiter; unmaintained notice only" },
    # A vulnerability with no fix on its line (2026-10-25): crypto-bigint 0.5.5 via str0m 0.24.1
    # > dimpl 0.7 (and str0m-rust-crypto 0.6) > ecdsa/p256/p384 0.16/0.13 > elliptic-curve 0.13,
    # the WebRTC (DTLS) path of nfx-node only; no money crate depends on it. Fixed only in
    # crypto-bigint >= 0.7.6, which no release of dimpl (0.8.0 included) or str0m uses yet; the
    # 0.7 copy in the tree is 0.7.6. Remove at the first str0m/dimpl release on elliptic-curve
    # 0.14, or switch str0m's crypto backend. Revisit by 2026-12-31.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via str0m > dimpl > elliptic-curve 0.13 (WebRTC DTLS only); no fixed 0.5 release; revisit by 2026-12-31" },
    # chrono's "unmaintained" notice (2026-11-17): every chrono release is marked, there is no patched
    # one and no vulnerability. It comes in only through dependencies (nfx's own code has no chrono):
    # iroh-blobs, iroh > netwatch > wmi (Windows only) and serde_with. Remove when those drop it; revisit
    # at every iroh bump.
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 via iroh-blobs, iroh > netwatch > wmi (Windows) and serde_with; unmaintained notice only, no patched release; revisit by 2026-12-31" },
    # Tauri's tree (desktop app only): the unic-* Unicode tables via tauri-utils >
    # urlpattern are unmaintained, not vulnerable. Revisit at every tauri bump.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range via tauri-utils > urlpattern; unmaintained notice" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common via tauri-utils > urlpattern; unmaintained notice" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property via tauri-utils > urlpattern; unmaintained notice" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via tauri-utils > urlpattern; unmaintained notice" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via tauri-utils > urlpattern; unmaintained notice" },
    # Unsound, not a vulnerability: glib 0.18.5's VariantStrIter iterator impls, in Tauri's
    # Linux stack only (tauri 2.11.6 > wry 0.55 / tao 0.35 > gtk 0.18 and webkit2gtk 2.0). No nfx
    # code calls glib. Fixed only in glib 0.20 (gtk-rs 0.20), which the locked Tauri does not use.
    # Revisit at every tauri bump.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18.5 VariantStrIter unsound, via tauri > wry/tao > gtk 0.18 (Linux only); nfx never calls glib; fixed only in gtk-rs 0.20, which the locked tauri 2.11.6 does not use; revisit at every tauri bump" },
    # Unsound, not vulnerabilities (2026-11-19): nine heapless advisories published together
    # (RUSTSEC-2026-0574 to -0582), every one fixed only in heapless >= 0.9.4. heapless enters only
    # through two crates, and no nfx crate names a heapless type:
    #   - heapless 0.7.17 via iroh's postcard 1.1.3, which uses only heapless::Vec and ::String;
    #   - heapless 0.8.0 via nostr 0.45 > faster-hex 0.10.1, which uses only Vec and String.
    # (Read from the .crate files whose sha256 equals the lock's checksums: postcard 6764c3b5…,
    # faster-hex 04839bdf….) The affected functions are IndexMap (-0576, -0582), Deque (-0579,
    # -0581), SortedLinkedList (-0574, -0578), spsc (-0575), the pools (-0580), and in -0577
    # Vec's IntoIter::drop, which needs an element whose Drop panics: here elements are bytes or
    # serde-visited values of crates that never name heapless. None is reachable. No release of
    # postcard or faster-hex uses heapless >= 0.9.4 yet. Remove when both move; revisit by 2026-12-31.
    { id = "RUSTSEC-2026-0574", reason = "heapless SortedLinkedList FindMutView::pop; heapless only via postcard/faster-hex, which use Vec/String only; revisit by 2026-12-31" },
    { id = "RUSTSEC-2026-0575", reason = "heapless spsc::Spsc::peek ordering; not used (postcard/faster-hex use Vec/String only); revisit by 2026-12-31" },
    { id = "RUSTSEC-2026-0576", reason = "heapless IndexMap::truncate; not used (postcard/faster-hex use Vec/String only); revisit by 2026-12-31" },
    { id = "RUSTSEC-2026-0577", reason = "heapless panic-safety in Deque/HistoryBuf/IndexMap and vec::IntoIter::drop; Vec elements here are bytes or serde values with no panicking Drop; revisit by 2026-12-31" },
    { id = "RUSTSEC-2026-0578", reason = "heapless SortedLinkedList::zeroize; not used (postcard/faster-hex use Vec/String only); revisit by 2026-12-31" },
    { id = "RUSTSEC-2026-0579", reason = "heapless Deque::try_from; not used (postcard/faster-hex use Vec/String only); revisit by 2026-12-31" },
    { id = "RUSTSEC-2026-0580", reason = "heapless pool (treiber stack) race; not used (postcard/faster-hex use Vec/String only); revisit by 2026-12-31" },
    { id = "RUSTSEC-2026-0581", reason = "heapless Deque::make_contiguous; not used (postcard/faster-hex use Vec/String only); revisit by 2026-12-31" },
    { id = "RUSTSEC-2026-0582", reason = "heapless IndexMap::insert; not used (postcard/faster-hex use Vec/String only); revisit by 2026-12-31" },
]

[licenses]
# Permissive licenses only for dependencies. Our own crates are AGPL-3.0-or-later and
# unpublished, so they are exempt via `private`.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0", # public-domain dedication; rust-bitcoin (bitcoin_hashes & co.) via nostr, later CDK
    "CDLA-Permissive-2.0", # webpki-roots / webpki-root-certs (Mozilla root CA data), via iroh
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense", # public-domain dedication; iroh's wasm websocket stack
    "Zlib",
]
# Copyleft stays out of the global list: each MPL crate is named. MPL-2.0 is file-level
# and compatible with this repository's AGPL-3.0-or-later.
exceptions = [
    { allow = ["MPL-2.0"], crate = "attohttpc" }, # via iroh > portmapper > igd-next (UPnP)
    # Tauri's tree (desktop app only): Servo's CSS parser family via tauri-utils > kuchikiki,
    # and option-ext via dirs > dirs-sys.
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
