# The desktop app's policy: the main crates/deny.toml plus the exceptions Tauri's tree
# needs, each named. Run: cargo deny --manifest-path desktop/Cargo.toml --config desktop/deny.toml check

# cargo-deny policy for the NFX Rust workspace. Run: cargo deny check (from crates/).

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, notice) fails the check
# unless it is listed here with a reason.
yanked = "deny"
ignore = [
    # "Unmaintained" notices, not vulnerabilities: compile-time proc macros deep in iroh's
    # tree that cannot be swapped without forking it. Revisit at every iroh bump.
    { id = "RUSTSEC-2024-0436", reason = "paste (proc macro) via iroh > netwatch > netdev > netlink-packet-core; unmaintained notice only" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error (proc macro) via iroh-blobs > bao-tree > genawaiter; unmaintained notice only" },
    # Tauri's tree (desktop app only): the unic-* Unicode tables via tauri-utils >
    # urlpattern are unmaintained, not vulnerable. Revisit at every tauri bump.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range via tauri-utils > urlpattern; unmaintained notice" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common via tauri-utils > urlpattern; unmaintained notice" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property via tauri-utils > urlpattern; unmaintained notice" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via tauri-utils > urlpattern; unmaintained notice" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via tauri-utils > urlpattern; unmaintained notice" },
]

[licenses]
# Permissive licenses only for dependencies. Our own crates are AGPL-3.0-or-later and
# unpublished, so they are exempt via `private`.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0", # public-domain dedication; rust-bitcoin (bitcoin_hashes & co.) via nostr, later CDK
    "CDLA-Permissive-2.0", # webpki-roots / webpki-root-certs (Mozilla root CA data), via iroh
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense", # public-domain dedication; iroh's wasm websocket stack
    "Zlib",
]
# Copyleft stays out of the global list: each MPL crate is named. MPL-2.0 is file-level
# and compatible with this repository's AGPL-3.0-or-later.
exceptions = [
    { allow = ["MPL-2.0"], crate = "attohttpc" }, # via iroh > portmapper > igd-next (UPnP)
    # Tauri's tree (desktop app only): Servo's CSS parser family via tauri-utils > kuchikiki,
    # and option-ext via dirs > dirs-sys.
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
