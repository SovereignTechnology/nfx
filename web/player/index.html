<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFX test player</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  input { flex: 1 1 18rem; min-width: 0; padding: 6px; background: #222; color: #eee; border: 1px solid #444; }
  video { width: 100%; max-width: 960px; background: #000; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; }
</style>
<h1>NFX test player</h1>
<p>Give a manifest address and a relay to resolve the signed manifest over Nostr and find an
  origin in seeders' beacons, or give an origin and a root directly. Every file is checked
  against its sha256 and the hash list before the player uses it (NFX-05 §4).</p>
<form method="get">
  <input id="a" name="a" placeholder="manifest address, 38504:&lt;creator&gt;:&lt;namespace&gt;:&lt;video-id&gt;" autocomplete="off">
  <input id="relay" name="relay" placeholder="relay, e.g. wss://relay.example" autocomplete="off">
  <input id="origin" name="origin" placeholder="origin (optional hint), e.g. https://origin.example" autocomplete="off">
  <input id="root" name="root" placeholder="root (64 hex), without an address" autocomplete="off" pattern="[0-9a-f]{64}">
  <button>Play</button>
</form>
<video id="v" controls muted playsinline></video>
<pre id="log"></pre>
<script type="module" src="out/player.js"></script>
</html>
