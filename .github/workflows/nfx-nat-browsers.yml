# nfx #71 phase 3: browsers behind NATs. Two headless Chromium, each behind its own nftables
# router in a network namespace, share segments with signaling only through a stock Nostr
# relay (strfry, its pinned commit) and STUN only from a public nfxd (`--stun`): no tracker,
# no TURN. web/player/e2e-nat/run.sh builds the network and runs the cells (its header lists
# them and the bounds); web/player/e2e-nat/driver.ts drives the browsers and judges.
#
# It runs on the runner VM, not in a container, as root: network namespaces and nftables need
# it (as spike-s5.yml's NAT matrix). Nothing leaves the runner: the routers have no default
# route, and every address is on the runner's own namespaces.
#
# As ci.yml installs its tools: first-party actions pinned by commit SHA, every release
# download checked against a pinned sha256 and retried with backoff (#72), a token that can
# only read the repo, no secrets, no cache. Downloads: Node, wasm-pack and wasm-bindgen
# (pinned releases); the runner's rustup toolchain; apt packages (ffmpeg, nftables, strfry's
# build libraries); strfry at its pinned commit (web/player/e2e-strfry.sh); and Playwright's
# Chromium (the player's own test dependency, `playwright install`).
#
# The money lock pins this file with the rest of .github/workflows (crates/ci/check-locked.sh):
# an edit here needs its pin line in crates/ci/locked.sha256.
name: nfx-nat-browsers

on:
  pull_request:
    paths:
      - 'web/player/**'
      - '.github/workflows/nfx-nat-browsers.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nfx-nat-browsers-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.98.0"
  NODE_VERSION: "22.23.4"
  NODE_SHA256: "1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce"
  WASM_PACK_VERSION: "0.15.1"
  WASM_PACK_SHA256: "410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2"
  WASM_BINDGEN_VERSION: "0.2.128"
  WASM_BINDGEN_SHA256: "b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  nat:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read # check out the code it builds and tests
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchains (each download checked against its pinned sha256)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin" "$RUNNER_TEMP/node" "$RUNNER_TEMP/dl"
          # Each download retries with backoff (8 tries, about 4 min): release-download 504s turned CI red on 2026-11-09.
          curl -sSfL --retry 8 --retry-all-errors -o "$RUNNER_TEMP/dl/node.txz" "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  $RUNNER_TEMP/dl/node.txz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/dl/node.txz" -C "$RUNNER_TEMP/node" --strip-components=1
          curl -sSfL --retry 8 --retry-all-errors -o "$RUNNER_TEMP/dl/wasm-pack.tgz" "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  $RUNNER_TEMP/dl/wasm-pack.tgz" | sha256sum -c -
          curl -sSfL --retry 8 --retry-all-errors -o "$RUNNER_TEMP/dl/wasm-bindgen.tgz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  $RUNNER_TEMP/dl/wasm-bindgen.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/dl/wasm-pack.tgz" -C "$RUNNER_TEMP/dl"
          tar -xzf "$RUNNER_TEMP/dl/wasm-bindgen.tgz" -C "$RUNNER_TEMP/dl"
          install -m 0755 "$RUNNER_TEMP/dl/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" "$bin/"
          install -m 0755 "$RUNNER_TEMP/dl/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$bin/"
          { echo "$RUNNER_TEMP/node/bin"; echo "$bin"; } >> "$GITHUB_PATH"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - name: system packages (ffmpeg for nfx-package, nftables for the routers, strfry's build libraries)
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=8 update -qq
          sudo apt-get -o Acquire::Retries=8 install -y -qq --no-install-recommends ffmpeg nftables \
            g++ make pkg-config libtool libssl-dev zlib1g-dev liblmdb-dev libflatbuffers-dev libsecp256k1-dev libzstd-dev
      - name: strfry (the stock relay, at its pinned commit, built with its own Makefile)
        run: |
          set -euo pipefail
          bash web/player/e2e-strfry.sh "$RUNNER_TEMP/strfry" > "$RUNNER_TEMP/strfry.env"
          cat "$RUNNER_TEMP/strfry.env"
      - name: npm ci (no install scripts) and Playwright's Chromium
        working-directory: web/player
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          for i in 1 2 3 4 5; do
            npx --no-install playwright install --with-deps chromium && break
            [ "$i" -lt 5 ] || exit 1
            sleep $((i * 15))
          done
      - name: build (the WASM, the patched engine and the test page; nfxd and nfx-package)
        run: |
          set -euo pipefail
          (cd web/player && npm run build && npm run typecheck)
          cargo build --locked --manifest-path crates/Cargo.toml -p nfxd -p nfx-media --bins
      - name: the NAT cells (root, network namespaces)
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/strfry.env"
          sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" \
            "STRFRY=$STRFRY" "STRFRY_CONF=$STRFRY_CONF" "OUT=$PWD/nat-results" "WORK=$RUNNER_TEMP/nat-work" \
            bash web/player/e2e-nat/run.sh
      - name: summary
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" nat-results 2> /dev/null || true
          {
            echo "## Browsers behind NATs (nfx #71)"
            echo
            cat nat-results/results.md 2> /dev/null || echo "No results table: see the step above."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nat-browsers
          path: nat-results/
          retention-days: 30
