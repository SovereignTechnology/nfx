# Scheduled checks on an unchanged tree, as rbitcoin-org/rbitcoin's nightly workflows run (sovtech,
# 2026-11-06). Nothing here gates a merge, and nothing here measures, pins or changes the money code.
#
#   advisories   RUSTSEC for crates/ (the workspace ci.yml checks on every push) and
#                crates/desktop (the Tauri viewer, which no other job checks), and npm's
#                advisories for web/player: a new advisory shows here the night it is published,
#                not at the next push.
#   miri         nfx-proto's tests (the wire parser) under miri on the latest nightly, as rbitcoin
#                runs its primitives. The workspace forbids unsafe code (unsafe_code = "forbid"),
#                so what miri can still find is undefined behaviour reached through a dependency's
#                unsafe code (k256, sha2, base64, serde_json); nfx-pay-wire, a dependency, is
#                compiled under miri with it.
#
# A pull request that touches this file runs it once, so an edit is proven before the schedule
# runs it. The same tools as ci.yml: its pinned rust image, its sha256-pinned cargo-deny and Node.
# The money lock pins this file with the rest of .github/workflows: an edit here needs its pin line
# in crates/ci/locked.sha256.
name: nightly

on:
  schedule:
    - cron: '29 6 * * *'
  pull_request:
    paths:
      - '.github/workflows/nightly.yml'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  NODE_VERSION: "22.23.4"
  NODE_SHA256: "1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce"

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools (each download checked against its pinned sha256)
        run: |
          set -euo pipefail
          apt-get update && apt-get install -y --no-install-recommends xz-utils
          curl -sSfLo /tmp/deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  /tmp/deny.tgz" | sha256sum -c -
          tar -xzf /tmp/deny.tgz -C /tmp && install -m 0755 "/tmp/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/
          curl -sSfLo /tmp/node.txz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  /tmp/node.txz" | sha256sum -c -
          mkdir -p /opt/node && tar -xJf /tmp/node.txz -C /opt/node --strip-components=1
          echo /opt/node/bin >> "$GITHUB_PATH"
      # Each check records its outcome and does not stop the others; the last step fails the job
      # if any failed.
      - name: RUSTSEC, crates/
        id: crates
        continue-on-error: true
        working-directory: crates
        run: cargo deny --locked check advisories
      - name: RUSTSEC, crates/desktop
        id: desktop
        continue-on-error: true
        working-directory: crates/desktop
        run: cargo deny --locked check advisories
      - name: npm advisories (high and above), web/player
        id: player
        continue-on-error: true
        working-directory: web/player
        run: npm audit --package-lock-only --audit-level=high
      - name: verdict
        env:
          CRATES: ${{ steps.crates.outcome }}
          DESKTOP: ${{ steps.desktop.outcome }}
          PLAYER: ${{ steps.player.outcome }}
        run: |
          echo "crates: $CRATES, crates/desktop: $DESKTOP, web/player: $PLAYER"
          [ "$CRATES" = success ] && [ "$DESKTOP" = success ] && [ "$PLAYER" = success ]

  miri:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nightly with miri
        run: rustup toolchain install nightly --component miri --component rust-src --profile minimal --allow-downgrade
      - name: cargo miri test -p nfx-proto
        working-directory: crates
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          rustc --version
          cargo miri setup
          cargo miri test -p nfx-proto --locked
