# NFX CI on GitHub Actions, in a pinned image. `lock` gives the money crates' verdict
# (crates/ci/check-locked.sh) under a clean environment, installing nothing and restoring no
# cache, so nothing a branch or another job leaves behind can stand in for the build. `check`
# runs everything else (crates/ci/check.sh). The lock pins this file with the rest of
# .github/workflows, so an edit to it fails the lock wherever the lock still runs.
# crates/ci/gitlab-ci.yml holds the same two jobs for GitLab, and is dormant.
name: ci

on:
  push:
    # Branches only: a tag push runs nothing. A probe branch (probe/<tag>,
    # probe.yml) runs nothing either: its commit is thrown away, and has no lock verdict.
    branches: ['**', '!probe/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# No job restores or saves a cache: the job's token gets no cache access (GitHub's
# `cache-mode`; omitted, a trusted trigger gets `write`).
cache-mode: none

# The tip of every push (but a probe's) runs in a group of its own, named by its commit, so
# no later push cancels its lock verdict; only a pull request's superseded runs are
# cancelled. A commit pushed below a tip gets no run of its own: check-locked.sh lists every
# push that gets no lock verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  WASM_PACK_VERSION: "0.13.1"
  WASM_PACK_SHA256: "c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"
  NODE_VERSION: "22.22.0"
  NODE_SHA256: "9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37"

jobs:
  lock:
    runs-on: ubuntu-24.04
    # A hang fails in bounded time (each scenario is also timed out on its own thread). The
    # job's time has varied from 56 to 76 min on the runners (runs 40811478196, 41143765468).
    timeout-minutes: 180
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: lock
        shell: bash
        run: |
          # System-wide, so it survives env -i (HOME=/root below); first, since the guard
          # below reads the tree through git.
          git config --system --add safe.directory "$(pwd -P)"
          # The lock is skipped only on a branch that holds no money code and never held
          # any (main, and branches older than the lock). Either of two things makes it
          # run, and then anything short of the whole lock fails here:
          #  - history: a commit in HEAD's history changed a file of the lock or a path of
          #    the money code, as the commit that introduced the lock did. So a branch that
          #    ever held money code runs the lock whatever its tree calls that code now, and
          #    a history squashed or rewritten counts by the paths its commits changed;
          #  - content: a money crate, a locked path or a part of the lock; a Rust file,
          #    Cargo manifest or Cargo.lock naming a money crate in its bytes; or a manifest
          #    or Cargo.lock naming one as cargo reads it, in any key or string once decoded
          #    (an escape, a multi-line string, a `package =` rename). One that Python's
          #    TOML 1.0 reader cannot read, or that is not a regular file, counts as naming
          #    one, and so does a submodule, whose files are not here to read.
          # What that leaves: money logic written afresh under other names, on a history
          # that never held any, which no lock can tell from other code (check-locked.sh).
          lock_files=(crates/ci/check-locked.sh crates/ci/lock-job.sh crates/ci/locked.py crates/ci/locked.sha256 crates/ci/locked-compiled.txt)
          money_paths=(crates/nfx-pay crates/nfx-pay-wire crates/nfx-node/src/pay crates/nfx-node/src/origin_pay.rs)
          shallow=$(git rev-parse --is-shallow-repository) || { echo "lock: git rev-parse failed"; exit 1; }
          [ "$shallow" = false ] || { echo "lock: the checkout is shallow, so the guard cannot read its history"; exit 1; }
          history=$(git rev-list --full-history -1 HEAD -- "${lock_files[@]}" "${money_paths[@]}") || { echo "lock: git rev-list failed"; exit 1; }
          money=$(git ls-files -- "${money_paths[@]}") || { echo "lock: git ls-files failed"; exit 1; }
          rc=0; named=$(git grep -l -E 'nfx[-_]pay' -- '*.rs' '*Cargo.toml' '*Cargo.lock') || rc=$?
          [ "$rc" -le 1 ] || { echo "lock: git grep failed ($rc)"; exit 1; }
          decoded=$(/usr/bin/python3 -I -S - <<'PY'
          import re, subprocess, tomllib
          money = re.compile("nfx[-_]pay")
          def names(v):  # every key and every string of a decoded TOML document
              if isinstance(v, dict):
                  for k, x in v.items():
                      yield k
                      yield from names(x)
              elif isinstance(v, list):
                  for x in v:
                      yield from names(x)
              elif isinstance(v, str):
                  yield v
          tracked = subprocess.run(["git", "ls-files", "-s", "-z"], check=True, stdout=subprocess.PIPE).stdout
          for entry in tracked.split(b"\0")[:-1]:
              meta, _, path = entry.partition(b"\t")
              mode, shown = meta.split(b" ")[0], ascii(path.decode("utf-8", "backslashreplace"))
              if mode == b"160000":
                  print(f"{shown}: a submodule")
              elif path.endswith((b"Cargo.toml", b"Cargo.lock")):
                  if mode not in (b"100644", b"100755"):
                      print(f"{shown}: not a regular file")
                      continue
                  try:
                      with open(path, "rb") as f:
                          if any(money.search(s) for s in names(tomllib.load(f))):
                              print(f"{shown}: names a money crate")
                  except Exception as e:
                      print(f"{shown}: not read as TOML ({type(e).__name__})")
          PY
          ) || { echo "lock: reading the Cargo manifests failed"; exit 1; }
          lock=$(git ls-files -- "${lock_files[@]}") || { echo "lock: git ls-files failed"; exit 1; }
          if [ -z "$history$money$named$decoded$lock" ]; then
            echo "no money code and no money-code lock on this branch, or in its history"; exit 0
          fi
          echo "lock: required here by:${history:+ history (${history:0:12})}${money:+ money paths}${named:+ names in bytes}${decoded:+ what cargo reads}${lock:+ lock files}"
          [ -z "$decoded" ] || head -n 5 <<<"$decoded"
          if [ ! -f crates/ci/locked.sha256 ] || [ ! -f crates/ci/lock-job.sh ]; then
            echo "money code or part of the lock is here, or in this branch's history, but not the whole lock (crates/ci/locked.sha256, crates/ci/lock-job.sh)"
            exit 1
          fi
          /usr/bin/env -i PATH=/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/root RUSTUP_HOME=/usr/local/rustup CARGO_HOME="$(pwd -P)/.cargo-home" CI=true \
            CI_COMMIT_SHA="$GITHUB_SHA" PYTHON=/usr/bin/python3 /bin/bash -p crates/ci/lock-job.sh

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update && apt-get install -y --no-install-recommends python3 python3-venv xz-utils
          curl -sSfLo /tmp/node.txz "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz"
          echo "${NODE_SHA256}  /tmp/node.txz" | sha256sum -c -
          mkdir -p /opt/node && tar -xJf /tmp/node.txz -C /opt/node --strip-components=1
          echo /opt/node/bin >> "$GITHUB_PATH"
          python3 -m venv /opt/venv && /opt/venv/bin/pip install coincurve==21.0.0 pynacl==1.6.2 blake3==1.0.9 jsonschema==4.26.0
          rustup component add clippy rustfmt && rustup target add wasm32-unknown-unknown
          curl -sSfLo /tmp/deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_DENY_SHA256}  /tmp/deny.tgz" | sha256sum -c -
          tar -xzf /tmp/deny.tgz -C /tmp && install -m 0755 "/tmp/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/
          curl -sSfLo /tmp/wasm-pack.tgz "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_PACK_SHA256}  /tmp/wasm-pack.tgz" | sha256sum -c -
          tar -xzf /tmp/wasm-pack.tgz -C /tmp && install -m 0755 "/tmp/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/
      - name: check
        shell: bash
        env:
          CI: "true"
          LOCKED_DIRS_UNLOCKED: ""
          PYTHON: /opt/venv/bin/python
        run: |
          git config --system --add safe.directory "$(pwd -P)"
          # The CI's own CARGO_HOME, inside the checkout: the lock refuses sources extracted
          # anywhere else (crates/ci/check-locked.sh --sources).
          export CARGO_HOME="$(pwd -P)/.cargo-home"
          crates/ci/check.sh
